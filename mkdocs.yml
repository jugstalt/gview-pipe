site_name: gView.Pipe
site_description: Workflow automation for gView
docs_dir: docs/site
site_dir: artifacts/docs/site
repo_url: https://github.com/jugstalt/gview-pipe

# relative links and file names: the same site runs at the root of a docs host and under /docs in the Shell
use_directory_urls: false

theme:
  name: material
  # no Google Fonts: the site must work offline inside the Shell
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: de
          name: Deutsch
          build: true
          nav_translations:
            Home: Start
            User Guide: Anwenderhandbuch
            Admin Guide: Administratorhandbuch
            Developer Guide: Entwicklerhandbuch
            Getting started: Erste Schritte
            Triggers and webhooks: Trigger und Webhooks
            Error handling: Fehlerbehandlung
            Node reference: Node-Referenz
            Installation: Installation
            Configuration: Konfiguration
            Plugins: Plugins
            Running scripts: Skripte ausführen
            Operations: Betrieb
            Security: Sicherheit
            Troubleshooting: Fehlersuche

validation:
  links:
    anchors: warn

nav:
  - Home: index.md
  - User Guide:
      - user-guide/index.md
      - Getting started: user-guide/getting-started.md
      - Triggers and webhooks: user-guide/triggers.md
      - Error handling: user-guide/error-handling.md
      # generated (src/gView.Pipe.Docs), not committed; the category pages are linked from the index
      - Node reference: user-guide/nodes/index.md
  - Admin Guide:
      - admin-guide/index.md
      - Installation: admin-guide/installation.md
      - Configuration: admin-guide/configuration.md
      - Plugins: admin-guide/plugins.md
      - Running scripts: admin-guide/scripts.md
      - Operations: admin-guide/operations.md
      - Security: admin-guide/security.md
      - Troubleshooting: admin-guide/troubleshooting.md
  - Developer Guide: developer-guide/index.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
