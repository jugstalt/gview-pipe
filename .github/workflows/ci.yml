name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build gView.Pipe.slnx --configuration Release
      - name: Test
        run: dotnet test --solution gView.Pipe.slnx --configuration Release --no-build
